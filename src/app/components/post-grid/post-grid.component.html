<div>Active Post ID: {{ facade.activePostId() ?? 'None' }}</div>
<div class="row">
  @for (post of facade.posts(); track $index) {
    <app-post-square
      [post]="post"
      [isActive]="post.id === facade.activePostId()"
      [activePropertyIndex]="facade.activePropertyIndex()"
      (squareClicked)="onSquareClicked($event)"
    />
  }
</div>
